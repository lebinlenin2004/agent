services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: vacancy, POSTGRES_PASSWORD: vacancy, POSTGRES_DB: vacancy}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U vacancy"], interval: 5s, retries: 10}
    ports: ["5432:5432"]
  redis:
    image: redis:7
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vacancy:vacancy@db:5432/vacancy
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8000:8000"]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vacancy:vacancy@db:5432/vacancy
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app.celery_app worker -l info --concurrency 2
    depends_on: [api, redis]
  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vacancy:vacancy@db:5432/vacancy
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.tasks.celery_app.celery_app beat -l info
    depends_on: [redis]
volumes:
  pgdata:
